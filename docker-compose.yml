services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildora-django}
      POSTGRES_USER: ${POSTGRES_USER:-buildora-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildora-django}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
